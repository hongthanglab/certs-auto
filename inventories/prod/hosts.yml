all:
  vars:
    ansible_user: devops
    ansible_port: 22
    env: prod

  children:
    nginx_servers:
      hosts:
        nginx-prod-01.internal:
          ansible_host: 10.100.10.21
          nginx_cert_dir: /etc/nginx/ssl
          nginx_service_name: nginx
        nginx-prod-02.internal:
          ansible_host: 10.100.10.22
          nginx_cert_dir: /etc/nginx/ssl
          nginx_service_name: nginx

    haproxy_servers:
      hosts:
        haproxy-prod-01.internal:
          ansible_host: 10.100.10.31
          haproxy_cert_dir: /etc/haproxy/certs
          haproxy_service_name: haproxy
        haproxy-prod-02.internal:
          ansible_host: 10.100.10.32
          haproxy_cert_dir: /etc/haproxy/certs
          haproxy_service_name: haproxy

    k8s_bastions:
      hosts:
        k8s-prod-bastion.internal:
          ansible_host: 10.100.10.41
          k8s_clusters:
            - name: prod-cluster-01
              kubeconfig_path: /etc/kubernetes/admin.conf
              target_namespaces:
                - ingress-nginx
                - production
            - name: prod-cluster-02
              kubeconfig_path: /etc/kubernetes/admin-dr.conf
              target_namespaces:
                - ingress-nginx
