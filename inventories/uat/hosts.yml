all:
  vars:
    ansible_user: devops
    ansible_port: 22
    env: uat

  children:
    nginx_servers:
      hosts:
        nginx-uat-01.internal:
          ansible_host: 192.168.10.21
          nginx_cert_dir: /etc/nginx/ssl
          nginx_service_name: nginx
        nginx-uat-02.internal:
          ansible_host: 192.168.10.22
          nginx_cert_dir: /etc/nginx/ssl
          nginx_service_name: nginx

    haproxy_servers:
      hosts:
        haproxy-uat-01.internal:
          ansible_host: 192.168.10.31
          haproxy_cert_dir: /etc/haproxy/certs
          haproxy_service_name: haproxy

    k8s_bastions:
      hosts:
        k8s-uat-bastion.internal:
          ansible_host: 192.168.10.41
          k8s_clusters:
            - name: uat-cluster-01
              kubeconfig_path: /home/devops/.kube/config
              target_namespaces:
                - ingress-nginx
                - default
