---
# ==============================================================================
# Enterprise SSL/TLS Certificate Distribution Playbook (Production HAProxy)
# Architecture: DevSecOps Zero-Trust & Defense-in-Depth
# ==============================================================================

- name: "INIT | Load Certificate & Key from Jenkins Agent"
  hosts: all
  gather_facts: false
  tasks:
    - name: "Load certificate data securely from local files into memory"
      ansible.builtin.set_fact:
        cert_content: "{{ lookup('ansible.builtin.file', cert_file_path) }}"
        key_content: "{{ lookup('ansible.builtin.file', key_file_path) }}"
      no_log: true
  tags:
    - always

- name: "DEPLOY | Distribute SSL/TLS to HAProxy Load Balancers"
  hosts: haproxy_servers
  gather_facts: true
  serial: 1      # Rolling reload: one LB at a time to ensure continuous traffic availability
  roles:
    - role: haproxy_cert
      tags:
        - haproxy
        - deploy

- name: "VERIFY | Perform Post-Deployment TLS Handshake Verification"
  hosts: haproxy_servers
  gather_facts: false
  roles:
    - role: verify_cert
      tags:
        - verify
