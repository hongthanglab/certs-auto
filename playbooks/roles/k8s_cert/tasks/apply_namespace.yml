---
- name: "K8S [{{ cluster.name }} : {{ target_namespace }}] | Manage Ephemeral Secret Manifest"
  vars:
    secret_manifest_path: "/dev/shm/tls-secret-{{ cluster.name }}-{{ target_namespace }}-{{ ansible_date_time.epoch }}.yaml"
    sanitized_cert_domain: "{{ cert_domain | regex_replace('\\.', '-') }}"
    k8s_secret_name: "tls-{{ sanitized_cert_domain }}"
  block:
    - name: "K8S | Encode certificate and private key in base64"
      ansible.builtin.set_fact:
        b64_cert: "{{ cert_content | b64encode }}"
        b64_key: "{{ key_content | b64encode }}"
      no_log: true

    - name: "K8S | Render ephemeral Secret YAML into RAM disk (/dev/shm)"
      ansible.builtin.template:
        src: tls-secret.yaml.j2
        dest: "{{ secret_manifest_path }}"
        owner: root
        group: root
        mode: '0600'
      no_log: true

    - name: "K8S | Apply TLS Secret to cluster namespace"
      ansible.builtin.command:
        cmd: "kubectl apply -f {{ secret_manifest_path }} --kubeconfig={{ cluster.kubeconfig_path }}"
      register: kubectl_apply_result

    - name: "K8S | Verify secret existence"
      ansible.builtin.command:
        cmd: "kubectl get secret {{ k8s_secret_name }} -n {{ target_namespace }} --kubeconfig={{ cluster.kubeconfig_path }}"
      register: kubectl_get_result
      changed_when: false

  always:
    - name: "K8S ZERO TRUST | Securely wipe ephemeral secret manifest from disk"
      ansible.builtin.file:
        path: "{{ secret_manifest_path }}"
        state: absent
